<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>Mood Tracker Journal</title>
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Mood Tracker Journal</h1>
        <img id="startBtn" class="button" img src="assets/Play.png">
        <img id="stopBtn" class="hidden" img src="assets/Pause.png">
        <audio controls id="player" class="playlist"></audio>
        <form class="mood-rect">
          <img class="mood-button" id="angry" src="assets/Angry Wheat.png">
          <img class="mood-button" id="upset" src="assets/Upset Wheat.png">
          <img class="mood-button" id="ok" src="assets/Ok Wheat.png">
          <img class="mood-button" id="happy" src="assets/Happy Wheat.png">
          <img class="mood-button" id="great" src="assets/Great Wheat.png">
          <button class="button" id="submit">Submit</button>
        </form>
    </body>
</html>
